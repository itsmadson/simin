[project]
name = "simin"
version = "0.1.0"
description = "Research-first adaptive crypto trading platform"
requires-python = ">=3.12"
# Only what is actually imported. Declaring aspirational dependencies bloats the
# image, slows every build, and makes the manifest a poor description of the code.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
research = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "optuna>=3.6",
    "polars>=1.0",
    "pyarrow>=16.0",
]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
simin = "simin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/simin"]

[[tool.mypy.overrides]]
module = ["polars.*", "lightgbm.*", "optuna.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]
