<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simin · سیمین</title>
<style>
:root{
  --bg:#0a0e13; --panel:#121922; --panel-2:#0f151d; --line:#1e2a38; --line-2:#2a3a4d;
  --text:#e8eef5; --muted:#8397ae; --dim:#5d7186;
  --good:#3fb950; --bad:#f0523f; --warn:#d9a020; --accent:#4b9dff; --accent-dim:#1b4a80;
  --radius:10px; --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
html[dir="rtl"] .app{grid-template-columns:1fr 230px}
html[dir="rtl"] aside{order:2}

/* sidebar */
aside{background:var(--panel-2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:17px;letter-spacing:.5px}
.brand .sub{color:var(--dim);font-size:11px;margin-top:3px}
nav{padding:10px 8px;flex:1;overflow-y:auto}
nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--muted);
  padding:9px 12px;border-radius:8px;cursor:pointer;text-align:start;margin-bottom:2px}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.active{background:var(--accent-dim);color:#fff}
nav button .ico{width:16px;text-align:center;opacity:.9}
nav .group{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:14px 12px 6px}
.sidefoot{padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

/* main */
main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--panel-2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h2{margin:0;font-size:15px;font-weight:600;flex:1}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.badge.lab{color:var(--accent);border-color:var(--accent)}
.badge.real{color:var(--bad);border-color:var(--bad);font-weight:700}
.badge.halt{color:var(--bad);border-color:var(--bad)}
.content{padding:20px;display:none}
.content.visible{display:block}

/* pieces */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi.sm{font-size:19px}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
html[dir="rtl"] td.num,html[dir="rtl"] th.num{text-align:start}
tbody tr:hover{background:var(--panel-2)}
.scroll{overflow-x:auto}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.empty{color:var(--dim);padding:26px 10px;text-align:center;font-size:13px;line-height:1.6}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line-2);color:var(--text);border-radius:7px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
input,select{background:var(--bg);border:1px solid var(--line-2);color:var(--text);border-radius:7px;padding:8px 10px;width:100%}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
canvas{width:100%;display:block}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.pill.on{color:var(--good);border-color:var(--good)}
.pill.off{color:var(--bad);border-color:var(--bad)}
.note{background:var(--panel-2);border:1px solid var(--line);border-inline-start:3px solid var(--accent);
  border-radius:7px;padding:12px 14px;color:var(--muted);font-size:12.5px;line-height:1.65;margin-bottom:14px}
.note.warn{border-inline-start-color:var(--warn)}
.note.bad{border-inline-start-color:var(--bad)}
ol,ul{margin:6px 0;padding-inline-start:20px;line-height:1.7}
code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--accent)}
.gaterow{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.gaterow .n{color:var(--dim);width:24px;text-align:end;font-family:var(--mono)}
.gaterow .req{color:var(--dim);font-size:11.5px;margin-inline-start:auto;text-align:end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:880px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{display:flex;flex-wrap:wrap}nav button{width:auto}}
html[dir="rtl"] body{font-family:Vazirmatn,Tahoma,var(--font)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Simin · سیمین</h1>
      <div class="sub" id="brand-sub">algorithmic trading</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <div id="foot-version">—</div>
      <button class="btn" id="lang" style="margin-top:8px;width:100%">فارسی</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="page-title">Overview</h2>
      <span class="badge" id="badge-mode">—</span>
      <span class="badge" id="badge-profile">—</span>
      <span class="badge" id="badge-session">—</span>
      <button class="btn danger" id="kill">Kill switch</button>
    </div>
    <div id="pages"></div>
  </main>
</div>

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.status;
    try { detail = (await res.json()).detail ?? detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function table(cols, rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  const head = cols.map(c=>`<th class="${c.num?"num":""}">${esc(c.label)}</th>`).join("");
  const body = rows.map(r=>"<tr>"+cols.map(c=>`<td class="${c.num?"num":""} ${c.cls?c.cls(r):""}">${c.get(r)}</td>`).join("")+"</tr>").join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- charts: plain canvas, no libraries, no network ---------- */
function lineChart(canvas, series, opts={}){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width = canvas.clientWidth * dpr;
  const h = canvas.height = (opts.height || 200) * dpr;
  ctx.clearRect(0,0,w,h);
  if(!series || series.length < 2){
    ctx.fillStyle = "#5d7186"; ctx.font = `${12*dpr}px sans-serif`; ctx.textAlign="center";
    ctx.fillText(opts.empty || "no data", w/2, h/2);
    return;
  }
  const pad = 4*dpr;
  const min = Math.min(...series), max = Math.max(...series), span = (max-min)||1;
  // zero-ish baseline grid
  ctx.strokeStyle = "#1e2a38"; ctx.lineWidth = dpr;
  for(let i=0;i<=3;i++){ const y = pad + (h-2*pad)*i/3; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  const x = i => (i/(series.length-1))*w;
  const y = v => h - pad - ((v-min)/span)*(h-2*pad);
  const up = series[series.length-1] >= series[0];
  const color = opts.color || (up ? "#3fb950" : "#f0523f");
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, color+"44"); grad.addColorStop(1, color+"00");
  ctx.beginPath(); ctx.moveTo(0,h);
  series.forEach((v,i)=>ctx.lineTo(x(i),y(v)));
  ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  series.forEach((v,i)=> i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
  ctx.strokeStyle=color; ctx.lineWidth=2*dpr; ctx.stroke();
}

function barChart(canvas, labels, values, opts={}){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width = canvas.clientWidth*dpr;
  const h = canvas.height = (opts.height||190)*dpr;
  ctx.clearRect(0,0,w,h);
  if(!values.length){
    ctx.fillStyle="#5d7186"; ctx.font=`${12*dpr}px sans-serif`; ctx.textAlign="center";
    ctx.fillText(opts.empty||"no data", w/2, h/2); return;
  }
  const maxAbs = Math.max(...values.map(Math.abs), 1e-9);
  const bw = w/values.length;
  const mid = h/2;
  ctx.strokeStyle="#1e2a38"; ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
  values.forEach((v,i)=>{
    const bh = (Math.abs(v)/maxAbs)*(h/2-14*dpr);
    ctx.fillStyle = v>=0 ? "#3fb950" : "#f0523f";
    ctx.fillRect(i*bw+bw*0.2, v>=0?mid-bh:mid, bw*0.6, bh);
    ctx.fillStyle="#8397ae"; ctx.font=`${10*dpr}px sans-serif`; ctx.textAlign="center";
    const label = String(labels[i]??"").slice(0,10);
    ctx.fillText(label, i*bw+bw/2, h-3*dpr);
  });
}

        <div><label>${t("strategy")}</label><select id="l-strategy">${meta.strategies.map(s=>`<option>${s}</option>`).join("")}</select></div>

        <div><button class="btn primary" id="l-run">${t("runBacktest")}</button></div>
      </div>
    </div>
    <div id="l-out" style="margin-top:14px"></div>`;

  document.getElementById("l-run").onclick = async () => {
    const btn = document.getElementById("l-run");
    const out = document.getElementById("l-out");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${t("running")}`;
    out.innerHTML = "";
    try {
      const body = {
        symbol: document.getElementById("l-symbol").value,
        timeframe: document.getElementById("l-tf").value,
        strategy: document.getElementById("l-strategy").value,
        start: document.getElementById("l-start").value,
        risk_profile: document.getElementById("l-profile").value,
        cost_multiplier: Number(document.getElementById("l-cost").value),
        use_regime_filter: document.getElementById("l-regime").value === "true",
      };
      const r = await api("/api/lab/backtest", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
      const res = r.result;
      const rows = [res, ...r.benchmarks];
      out.innerHTML = `
        <div class="grid">
          <div class="card"><h3>${t("return_")}</h3><div class="kpi ${sign(res.total_return)}">${pct(res.total_return)}</div>
            <div class="sub">${r.bars} ${t("bars")} · ${dt(r.period.from)} → ${dt(r.period.to)}</div></div>
          <div class="card"><h3>${t("dsr")}</h3><div class="kpi ${res.deflated_sharpe>=0.95?"good":"bad"}">${num(res.deflated_sharpe,2)}</div>
            <div class="sub">${t("sharpe")} ${num(res.sharpe,2)}</div></div>
          <div class="card"><h3>${t("maxdd")}</h3><div class="kpi ${res.max_drawdown<-0.2?"bad":""}">${pct(res.max_drawdown)}</div>
            <div class="sub">${t("trades")}: ${res.trades} · ${t("winRate")} ${pct(res.win_rate)}</div></div>
          <div class="card"><h3>${t("feeDrag")}</h3><div class="kpi ${res.fee_drag>0.3?"warn":""}">${pct(res.fee_drag)}</div>
            <div class="sub">${t("roundTrip")} ${pct(r.round_trip_cost)}</div></div>
          <div class="card full"><h3>${t("equityCurve")}</h3><canvas id="l-chart" height="220"></canvas></div>
          <div class="card full"><h3>${t("benchmarks")}</h3>
            <div class="note ${r.beats_all_benchmarks?"":"bad"}">${t("beatsAll")}: <b>${r.beats_all_benchmarks?t("yes"):t("no")}</b></div>
            ${table([{label:t("strategy"),get:x=>x.strategy===res.strategy?`<b>${esc(x.strategy)}</b>`:esc(x.strategy)},
                     {label:t("trades"),num:1,get:x=>x.trades},
                     {label:t("return_"),num:1,cls:x=>sign(x.total_return),get:x=>pct(x.total_return)},
                     {label:t("sharpe"),num:1,get:x=>num(x.sharpe,2)},
                     {label:t("maxdd"),num:1,get:x=>pct(x.max_drawdown)},
                     {label:t("feeDrag"),num:1,get:x=>pct(x.fee_drag)}],
                    rows.sort((a,b)=>b.total_return-a.total_return), "")}
          </div>
        </div>`;
      lineChart(document.getElementById("l-chart"), res.equity, {height:220});
    } catch(e) {
      out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = t("runBacktest");
    }
  };
};

/* ---------------------------- shell ---------------------------- */
function buildNav(){
  const nav = document.getElementById("nav");
  let html = "", group = null;
  for(const p of PAGES){
    if(p.group !== group){ group = p.group; html += `<div class="group">${tn(group)}</div>`; }
    html += `<button data-page="${p.id}" class="${p.id===page?"active":""}"><span class="ico">${p.ico}</span>${tn(p.id)}</button>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.page));
}

async function go(id){
  page = id; localStorage.setItem("simin-page", id);
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active", b.dataset.page===id));
  document.getElementById("page-title").textContent = tn(id);
  const pages = document.getElementById("pages");
  let root = document.getElementById("page-"+id);
  if(!root){ root = el(`<div class="content" id="page-${id}"></div>`); pages.appendChild(root); }
  pages.querySelectorAll(".content").forEach(c=>c.classList.remove("visible"));
  root.classList.add("visible");
  root.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  try { await RENDER[id](root); }
  catch(e){ root.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
}

async function refreshStatus(){
  try {
    status = await api("/api/status");
    const m = document.getElementById("badge-mode");
    const real = status.mode === "live";
    m.textContent = real ? "REAL" : "LAB · " + String(status.mode).toUpperCase();
    m.className = "badge " + (real ? "real" : "lab");
    document.getElementById("badge-profile").textContent = status.risk_profile;
    const sess = document.getElementById("badge-session");
    if(!status.trading_enabled){ sess.textContent = t("halted"); sess.className = "badge halt"; }
    else if(status.session){ sess.textContent = "session " + dt(status.session.started_at); sess.className = "badge"; }
    else { sess.textContent = "no session"; sess.className = "badge"; }
    document.getElementById("foot-version").textContent = "v" + status.version;
  } catch(e){ /* keep last known state */ }
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = I18N[lang].dir;
  document.getElementById("lang").textContent = t("toggle");
  document.getElementById("brand-sub").textContent = t("brandSub");
  document.getElementById("kill").textContent = t("kill");
  localStorage.setItem("simin-lang", lang);
  buildNav(); go(page);
}

document.getElementById("lang").onclick = () => { lang = lang==="en"?"fa":"en"; applyLang(); };
document.getElementById("kill").onclick = async () => {
  await fetch("/api/kill-switch?reason=dashboard", {method:"POST"});
  refreshStatus();
};
window.addEventListener("resize", () => { if(page==="overview"||page==="lab") go(page); });

applyLang();
refreshStatus();
setInterval(refreshStatus, 10000);
setInterval(() => { if(["overview","positions","signals","market"].includes(page)) go(page); }, 30000);
</script>
