# Simin — سیمین
#
#   docker compose up
#
# That is the whole setup. It starts on the offline demo venue, in LAB mode, at
# risk level 4, and needs no credentials and no network to the exchanges.
#
# Nothing here can spend money. Real trading requires SIMIN_MODE=real, real API
# credentials, SIMIN_REAL_MODE_ACKNOWLEDGED=1, a positive SIMIN_MAX_CAPITAL, and
# a typed confirmation phrase in the UI. Five separate deliberate acts, because
# the cost of starting a live bot by accident is unbounded.

name: simin

services:
  api:
    build:
      context: ./backend
      args:
        # Override when pypi.org is unreachable:
        #   docker compose build --build-arg PIP_INDEX_URL=<mirror>
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    ports:
      - "${SIMIN_API_PORT:-8000}:8000"
    environment:
      # --- Mode. Defaults are the safe ones. -----------------------------
      SIMIN_MODE: ${SIMIN_MODE:-lab}
      SIMIN_VENUE: ${SIMIN_VENUE:-offline}
      SIMIN_RISK_LEVEL: ${SIMIN_RISK_LEVEL:-4}
      SIMIN_SYMBOLS: ${SIMIN_SYMBOLS:-BTCUSDT ETHUSDT SOLUSDT}
      SIMIN_STARTING_EQUITY: ${SIMIN_STARTING_EQUITY:-10000}
      SIMIN_POLL_SECONDS: ${SIMIN_POLL_SECONDS:-15}

      # --- The real-mode gate. No defaults, deliberately. ----------------
      SIMIN_REAL_MODE_ACKNOWLEDGED: ${SIMIN_REAL_MODE_ACKNOWLEDGED:-}
      SIMIN_MAX_CAPITAL: ${SIMIN_MAX_CAPITAL:-0}
      SIMIN_TRADING_FROZEN: ${SIMIN_TRADING_FROZEN:-0}

      # --- Credentials. Set these in a .env file, never in this file. ----
      SIMIN_COINEX_KEY: ${SIMIN_COINEX_KEY:-}
      SIMIN_COINEX_SECRET: ${SIMIN_COINEX_SECRET:-}
      SIMIN_NOBITEX_KEY: ${SIMIN_NOBITEX_KEY:-}
      SIMIN_NOBITEX_SECRET: ${SIMIN_NOBITEX_SECRET:-}
      SIMIN_NOBITEX_BASE_URL: ${SIMIN_NOBITEX_BASE_URL:-}
      SIMIN_WALLEX_KEY: ${SIMIN_WALLEX_KEY:-}
      SIMIN_WALLEX_SECRET: ${SIMIN_WALLEX_SECRET:-}

      SIMIN_DATA_DIR: /data
      SIMIN_CORS_ORIGINS: ${SIMIN_CORS_ORIGINS:-http://localhost:3000}
      SIMIN_LOG_LEVEL: ${SIMIN_LOG_LEVEL:-INFO}
      SIMIN_LOG_JSON: ${SIMIN_LOG_JSON:-0}
    volumes:
      # Calibration results live here. Losing this volume means losing every
      # measured number on the dial, and the UI correctly reverts to saying
      # "not measured" rather than inventing one.
      - simin-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ui:
    build:
      context: ./frontend
      args:
        # The browser reaches the API directly, so this is the address as seen
        # from the browser — not from inside the compose network.
        NEXT_PUBLIC_API_URL: ${SIMIN_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${SIMIN_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  simin-data:
